<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go2 Command Console</title>
<style>
  :root{--bg:#0B1B2B;--panel:#13293D;--panel2:#0F2234;--border:#22384C;--teal:#1FBFA8;
        --white:#FFFFFF;--mute:#9FB3C8;--green:#2FBF71;--red:#E24B4A;--accent:#2E6FB5;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--white);
       font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:15px;}
  header{display:flex;align-items:center;justify-content:space-between;
         padding:14px 20px;border-bottom:1px solid var(--border);}
  .title{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;}
  .title svg{width:22px;height:22px;stroke:var(--teal);}
  .badge{font-size:13px;background:rgba(47,191,113,.15);color:var(--green);
         padding:4px 12px;border-radius:20px;border:1px solid rgba(47,191,113,.3);}
  .wrap{display:flex;gap:16px;padding:16px 20px;max-width:1000px;margin:0 auto;}
  .main{flex:2;min-width:0;}
  .side{flex:1;min-width:190px;display:flex;flex-direction:column;gap:10px;}
  #log{display:flex;flex-direction:column;gap:14px;min-height:320px;max-height:60vh;overflow-y:auto;padding-right:4px;}
  .cmd{align-self:flex-end;background:rgba(46,111,181,.25);border:1px solid rgba(46,111,181,.5);
       color:#cfe3f7;padding:9px 13px;border-radius:12px;max-width:80%;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px;}
  .row .lbl{color:var(--mute);min-width:78px;}
  .pill{font-size:12px;padding:2px 9px;border-radius:6px;}
  .pill.ok{background:rgba(47,191,113,.18);color:var(--green);}
  .pill.no{background:rgba(226,75,74,.18);color:var(--red);}
  code{background:var(--panel2);padding:2px 7px;border-radius:6px;color:var(--teal);font-size:13px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;}
  .stat .k{font-size:12px;color:var(--mute);}
  .stat .v{font-size:17px;font-weight:600;margin-top:2px;}
  #stop{background:rgba(226,75,74,.15);color:var(--red);border:1px solid rgba(226,75,74,.45);
        border-radius:10px;padding:13px;font-size:16px;font-weight:600;cursor:pointer;
        display:flex;align-items:center;justify-content:center;gap:8px;}
  #stop:hover{background:rgba(226,75,74,.28);}
  .bar{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);
       max-width:1000px;margin:0 auto;}
  #text{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--white);
        border-radius:9px;padding:11px 13px;font-size:15px;outline:none;}
  #text:focus{border-color:var(--teal);}
  .iconbtn{width:44px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;
           color:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .iconbtn:hover{border-color:var(--teal);}
  .iconbtn svg{width:20px;height:20px;stroke:currentColor;}
  .iconbtn.rec{color:var(--red);border-color:var(--red);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .hint{color:var(--mute);font-size:12.5px;margin-top:8px;}
  .note{color:#f0a; font-size:12.5px;margin-top:6px;}
</style>
</head>
<body>
<header>
  <div class="title">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="4" y="8" width="16" height="10" rx="2"/><path d="M12 8V5M9 13h.01M15 13h.01M8 18v2M16 18v2"/></svg>
    LLM Agents for Robots &mdash; Command console
  </div>
  <div class="badge" id="badge">standing</div>
</header>

<div class="wrap">
  <div class="main">
    <div id="log"></div>
    <div class="hint">Try: &ldquo;walk forward for 3 seconds&rdquo;, &ldquo;turn left&rdquo;, &ldquo;back for 2 seconds&rdquo;, &ldquo;stop&rdquo;. &ldquo;sit&rdquo; shows the unsupported-command fallback.</div>
  </div>
  <div class="side">
    <div class="stat"><div class="k">Robot state</div><div class="v" id="s_state">standing</div></div>
    <div class="stat"><div class="k">Last action</div><div class="v" id="s_action">&mdash;</div></div>
    <div class="stat"><div class="k">Speed</div><div class="v" id="s_speed">0.0 m/s</div></div>
    <button id="stop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      Stop
    </button>
    <div class="note" id="note"></div>
  </div>
</div>

<div class="bar">
  <input id="text" type="text" placeholder="Type a command, e.g. walk forward for 3 seconds" autocomplete="off">
  <button class="iconbtn" id="mic" title="Speak a command">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <button class="iconbtn" id="send" title="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg>
  </button>
</div>

<script>
const log=document.getElementById('log'), txt=document.getElementById('text');
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function addEntry(r){
  const cmd=document.createElement('div');cmd.className='cmd';cmd.innerHTML=esc(r.command);log.appendChild(cmd);
  const card=document.createElement('div');card.className='card';
  let html='';
  if(r.tool){html+=`<div class="row"><span class="lbl">Tool</span><code>${esc(r.tool)}</code></div>`;}
  const ok=r.valid;
  html+=`<div class="row"><span class="lbl">Safety</span><span class="pill ${ok?'ok':'no'}">${esc(r.validation)}</span></div>`;
  html+=`<div class="row"><span class="lbl">Robot</span><span>${esc(r.response)}</span></div>`;
  card.innerHTML=html;log.appendChild(card);
  log.scrollTop=log.scrollHeight;
}
async function send(text){
  if(!text.trim())return;
  const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  addEntry(await r.json());
}
document.getElementById('send').onclick=()=>{send(txt.value);txt.value='';};
txt.addEventListener('keydown',e=>{if(e.key==='Enter'){send(txt.value);txt.value='';}});
document.getElementById('stop').onclick=async()=>{await fetch('/api/stop',{method:'POST'});};
const mic=document.getElementById('mic');
mic.onclick=async()=>{
  mic.classList.add('rec');txt.placeholder='Listening… speak now (5s)';txt.disabled=true;
  try{const r=await fetch('/api/voice',{method:'POST'});addEntry(await r.json());}
  finally{mic.classList.remove('rec');txt.disabled=false;txt.placeholder='Type a command, e.g. walk forward for 3 seconds';}
};
async function poll(){
  try{const s=await (await fetch('/api/status')).json();
    document.getElementById('s_state').textContent=s.state;
    document.getElementById('badge').textContent=s.state;
    document.getElementById('s_action').textContent=s.action;
    document.getElementById('s_speed').textContent=s.speed.toFixed(1)+' m/s';
    document.getElementById('note').textContent=s.note||'';
  }catch(e){}
}
setInterval(poll,500);poll();
</script>
</body>
</html>
