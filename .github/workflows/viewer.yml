name: Viewer setup

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            architecture: arm64
            mujoco: '3.13.0'
          - name: Intel
            runner: macos-15-intel
            architecture: x86_64
            mujoco: '3.10.0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: Go2 simulator
      - name: Install from a fresh checkout
        run: bash "$GITHUB_WORKSPACE/Go2 simulator/macos/setup.sh"
      - name: Verify repeat setup
        run: bash "$GITHUB_WORKSPACE/Go2 simulator/macos/setup.sh"
      - name: Check native architecture and MuJoCo package
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_MUJOCO: ${{ matrix.mujoco }}
        run: |
          "$GITHUB_WORKSPACE/Go2 simulator/.venv/bin/python" - <<'PY'
          import os
          import platform
          import mujoco
          assert platform.machine() == os.environ['EXPECTED_ARCHITECTURE'], platform.machine()
          assert mujoco.__version__ == os.environ['EXPECTED_MUJOCO'], mujoco.__version__
          print(f'Native {platform.machine()} with MuJoCo {mujoco.__version__}')
          PY
      - name: Validate both launchers from outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          bash "$GITHUB_WORKSPACE/Go2 simulator/macos/Launch Go2 Viewer.command" --validate
          bash "$GITHUB_WORKSPACE/Go2 simulator/macos/Launch Go2 Viewer - Terrain.command" --validate
          "$GITHUB_WORKSPACE/Go2 simulator/_deps/tools/uv" pip check --python "$GITHUB_WORKSPACE/Go2 simulator/.venv/bin/python"
      - name: Validate the native mjpython entry point
        timeout-minutes: 2
        working-directory: ${{ runner.temp }}
        run: |
          # Hosted Mac runners cannot create the viewer's OpenGL window. Exercise
          # the actual native launcher and both scenes without creating a window.
          source "$GITHUB_WORKSPACE/Go2 simulator/macos/developer-tools.sh"
          "$GITHUB_WORKSPACE/Go2 simulator/.venv/bin/mjpython" "$GITHUB_WORKSPACE/Go2 simulator/go2_viewer.py" --validate
          "$GITHUB_WORKSPACE/Go2 simulator/.venv/bin/mjpython" "$GITHUB_WORKSPACE/Go2 simulator/go2_viewer.py" --terrain --validate
      - name: Install and test optional walking policy on Apple Silicon
        if: matrix.architecture == 'arm64'
        run: bash "$GITHUB_WORKSPACE/Go2 simulator/macos/setup.sh" --locomotion
      - name: Recheck walking through the Mac launcher
        if: matrix.architecture == 'arm64'
        working-directory: ${{ runner.temp }}
        run: |
          bash "$GITHUB_WORKSPACE/Go2 simulator/macos/run.sh" --walk --validate
          "$GITHUB_WORKSPACE/Go2 simulator/_deps/tools/uv" pip check --python "$GITHUB_WORKSPACE/Go2 simulator/.venv/bin/python"
      - name: Save Apple Silicon motion results
        if: always() && matrix.architecture == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: locomotion-macos-arm64
          path: Go2 simulator/_deps/locomotion-results.json

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: Go2 simulator
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install and verify repeat setup
        shell: powershell
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE 'Go2 simulator\windows\setup.ps1'
          $python = (Get-Command python).Source
          & $setup -Python $python
          & $setup -Python $python
      - name: Validate both launchers from outside the repository
        working-directory: ${{ runner.temp }}
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\Go2 simulator\windows\Launch Go2 Viewer.cmd" --validate
          if errorlevel 1 exit /b 1
          call "%GITHUB_WORKSPACE%\Go2 simulator\windows\Launch Go2 Viewer - Terrain.cmd" --validate
          if errorlevel 1 exit /b 1
          "%GITHUB_WORKSPACE%\Go2 simulator\.venv\Scripts\python.exe" -m pip check
      - name: Install and test optional walking policy
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\Go2 simulator\windows\setup.ps1" -Python (Get-Command python).Source -Locomotion
      - name: Recheck walking through the Windows launcher
        working-directory: ${{ runner.temp }}
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\Go2 simulator\windows\Launch Go2 Viewer.cmd" --walk --validate
          if errorlevel 1 exit /b 1
          "%GITHUB_WORKSPACE%\Go2 simulator\.venv\Scripts\python.exe" -m pip check
      - name: Save Windows motion results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: locomotion-windows-x64
          path: Go2 simulator/_deps/locomotion-results.json
